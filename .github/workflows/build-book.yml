name: Build book

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/build-book.yml"
  pull_request:
    paths:
      - "src/**"
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release with the built files"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: System libraries for WeasyPrint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 libffi-dev default-jre-headless

      - name: Python dependencies
        run: pip install -r src/requirements.txt epubcheck

      - name: Build PDF (colour)
        working-directory: src
        run: python3 build.py

      - name: Build PDF (print / grayscale)
        working-directory: src
        run: python3 build.py --print

      - name: Build EPUB
        working-directory: src
        run: python3 build_epub.py

      - name: Validate EPUB
        working-directory: src
        run: python3 -m epubcheck React19-Persian-Guide.epub

      - name: Sanity-check PDFs
        working-directory: src
        run: |
          python3 - <<'EOF'
          import pymupdf, sys
          for f in ["React19-Persian-Guide.pdf", "React19-Persian-Guide-Print.pdf"]:
              d = pymupdf.open(f)
              toc = [t for t in d.get_toc() if t[0] == 1]
              print(f, d.page_count, "pages,", len(toc), "outline entries")
              assert 200 <= d.page_count <= 280, f"unexpected page count {d.page_count}"
              assert len(toc) == 40, f"outline should list 40 top-level entries, got {len(toc)}"
              assert any("واژه" in t[1] for t in toc), "glossary missing from outline"
          EOF

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: react-19-persian-guide
          path: |
            src/React19-Persian-Guide.pdf
            src/React19-Persian-Guide-Print.pdf
            src/React19-Persian-Guide.epub
          retention-days: 30

      # NOTE: the committed copies under docs/pdf are the author's QA'd build (239 pages).  Runner font stacks (Pango/HarfBuzz) break lines
      # slightly differently and reflow the book, so CI never overwrites those files — it
      # verifies that the source builds, keeps the artifacts for review and can publish a
      # release on demand.
      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: React 19 Persian Guide — build ${{ github.run_number }}
          files: |
            src/React19-Persian-Guide.pdf
            src/React19-Persian-Guide-Print.pdf
            src/React19-Persian-Guide.epub
